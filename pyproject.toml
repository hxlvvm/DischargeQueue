[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dischargequeue"
version = "0.1.0"
description = "Capacity-aware 30-day readmission review queue on the UCI Diabetes 130-US hospitals data"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
